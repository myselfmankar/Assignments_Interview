<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job board</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 640px;
        padding: 16px;
        color: #222;
      }
      h1, h2 {
        margin-top: 24px;
        margin-bottom: 12px;
      }
      ul {
        padding: 0;
      }
      li {
        border: 1px solid #ddd;
        border-radius: 8px;
        list-style: none;
        margin: 8px 0;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .job-info {
        flex: 1;
      }
      input {
        font-size: 16px;
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #f7f7f7;
        white-space: nowrap;
      }
      button:hover:not(:disabled) {
        background: #eee;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      .saved-btn {
        background: #e8f5e9;
        border-color: #a5d6a7;
        color: #2e7d32;
      }
      .remove-btn {
        background: #ffebee;
        border-color: #ffcdd2;
        color: #c62828;
      }
      .remove-btn:hover:not(:disabled) {
        background: #ffcdd2;
      }
      .empty-msg {
        color: #666;
        font-style: italic;
        border: 1px dashed #ddd;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <h1>Jobs</h1>
    <input id="search" placeholder="Search by title, company or place" />
    <ul id="jobs"></ul>

    <h2>Saved jobs</h2>
    <ul id="saved-jobs"></ul>

    <script type="module" src="/app.js"></script>
  </body>
</html>
